<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Winged Solar Solutions — Links</title>
<meta name="description" content="Patented modular solar-generation and battery-storage systems for mobile, rapidly deployable, and permanent off-grid power. Explore the Sparrow, Hawk, and Eagle platforms." />
<meta name="theme-color" content="#0a0f1e" />

<!-- Open Graph / social preview -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Winged Solar Solutions" />
<meta property="og:description" content="Deployable solar power + storage. Power anywhere, on demand." />
<meta property="og:url" content="https://wingedsolar.com/" />

<style>
  /* =========================================================
     Winged Solar Solutions — Linktree
     Single-file, self-contained landing page.
     To edit links: change the LINKS array near the bottom
     of this file (inside the <script> tag). Nothing else
     needs to be touched.
     ========================================================= */

  :root {
    --bg-deep:   #060913;
    --bg-space:  #0a0f1e;
    --ink:       #f4f7ff;
    --ink-soft:  #aab4cf;
    --ink-faint: #6f7b99;

    --solar-1:   #ffd166;  /* sun core   */
    --solar-2:   #ff9e3d;  /* warm amber */
    --solar-3:   #ff6b35;  /* sunrise    */
    --sky:       #4f9dff;  /* clean-tech blue */

    --card:      rgba(255, 255, 255, 0.045);
    --card-hi:   rgba(255, 255, 255, 0.09);
    --border:    rgba(255, 255, 255, 0.10);
    --border-hi: rgba(255, 209, 102, 0.55);

    --radius:    16px;
    --maxw:      560px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg-space);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 48px;
    position: relative;
  }

  /* ---- Ambient background: deep space + rising sun glow ---- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(120% 80% at 50% 118%, rgba(255,107,53,0.28), transparent 55%),
      radial-gradient(90% 60% at 50% 108%, rgba(255,158,61,0.30), transparent 60%),
      radial-gradient(70% 45% at 50% 100%, rgba(255,209,102,0.28), transparent 62%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-space) 60%, #0c1226 100%);
  }
  /* starfield */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1.2px 1.2px at 78% 12%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px   1px   at 33% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.6px 1.6px at 62% 24%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px   1px   at 88% 34%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.2px 1.2px at 8%  40%, rgba(255,255,255,0.55), transparent);
    opacity: 0.55;
    mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 78%);
  }

  .wrap {
    width: 100%;
    max-width: var(--maxw);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------------- Header ---------------- */
  .logo {
    width: 96px;
    height: 96px;
    display: grid;
    place-items: center;
    border-radius: 24px;
    background:
      radial-gradient(80% 80% at 50% 30%, rgba(255,209,102,0.22), transparent 70%),
      linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
    border: 1px solid var(--border);
    box-shadow:
      0 0 0 1px rgba(255,209,102,0.10) inset,
      0 18px 50px rgba(255,107,53,0.20),
      0 6px 22px rgba(0,0,0,0.45);
    margin-bottom: 20px;
  }
  .logo svg { width: 62px; height: 62px; display: block; }

  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.1;
  }
  .brand-mark {
    background: linear-gradient(92deg, var(--solar-1), var(--solar-2) 55%, var(--solar-3));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tagline {
    margin-top: 10px;
    color: var(--ink-soft);
    font-size: 0.98rem;
    text-align: center;
    line-height: 1.5;
    max-width: 420px;
  }
  .pills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }
  .pill {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    padding: 5px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    white-space: nowrap;
  }

  /* ---------------- Links ---------------- */
  .links {
    width: 100%;
    margin-top: 34px;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .group-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 12px 4px 2px;
  }

  .link {
    --accent: var(--solar-2);
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    width: 100%;
    padding: 16px 18px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--ink);
    text-decoration: none;
    overflow: hidden;
    transition: transform 0.18s ease, border-color 0.18s ease,
                background 0.18s ease, box-shadow 0.18s ease;
  }
  .link::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0.85;
    transition: width 0.18s ease;
  }
  .link:hover,
  .link:focus-visible {
    transform: translateY(-2px);
    background: var(--card-hi);
    border-color: var(--border-hi);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,209,102,0.14);
    outline: none;
  }
  .link:hover::before,
  .link:focus-visible::before { width: 5px; }
  .link:active { transform: translateY(0); }

  .link .ic {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 11px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--accent);
  }
  .link .ic svg { width: 20px; height: 20px; display: block; }

  .link .body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .link .title { font-size: 0.98rem; font-weight: 650; letter-spacing: -0.01em; }
  .link .sub {
    font-size: 0.8rem;
    color: var(--ink-soft);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .link .chev {
    margin-left: auto;
    color: var(--ink-faint);
    flex: 0 0 auto;
    transition: transform 0.18s ease, color 0.18s ease;
  }
  .link:hover .chev { transform: translateX(3px); color: var(--accent); }

  /* ---------------- Socials ---------------- */
  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .soc {
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    text-decoration: none;
    transition: transform 0.18s ease, color 0.18s ease,
                border-color 0.18s ease, background 0.18s ease;
  }
  .soc:hover {
    transform: translateY(-3px);
    color: var(--solar-1);
    border-color: var(--border-hi);
    background: var(--card-hi);
  }
  .soc svg { width: 21px; height: 21px; display: block; }

  /* ---------------- Footer ---------------- */
  footer {
    margin-top: 34px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.76rem;
    line-height: 1.6;
  }
  footer a { color: var(--ink-soft); text-decoration: none; }
  footer a:hover { color: var(--solar-1); }

  @media (max-width: 420px) {
    body { padding-top: 40px; }
    h1 { font-size: 1.4rem; }
    .link { padding: 14px 15px; gap: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .wrap { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="wrap">
    <div class="logo" aria-hidden="true">
      <!-- Winged sun mark -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g-sun" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffe08a"/>
            <stop offset="0.5" stop-color="#ff9e3d"/>
            <stop offset="1" stop-color="#ff6b35"/>
          </linearGradient>
        </defs>
        <!-- sun core -->
        <circle cx="32" cy="34" r="10" fill="url(#g-sun)"/>
        <!-- rays -->
        <g stroke="url(#g-sun)" stroke-width="2.6" stroke-linecap="round">
          <line x1="32" y1="14" x2="32" y2="19"/>
          <line x1="18.5" y1="20.5" x2="22" y2="24"/>
          <line x1="45.5" y1="20.5" x2="42" y2="24"/>
        </g>
        <!-- left wing -->
        <path d="M31 34c-7-1-13-1-19 2 3-4 7-6 12-6-4-2-9-2-13 1 4-6 11-8 18-5z" fill="url(#g-sun)" opacity="0.92"/>
        <!-- right wing -->
        <path d="M33 34c7-1 13-1 19 2-3-4-7-6-12-6 4-2 9-2 13 1-4-6-11-8-18-5z" fill="url(#g-sun)" opacity="0.92"/>
      </svg>
    </div>

    <h1><span class="brand-mark">Winged Solar</span> Solutions</h1>
    <p class="tagline">Patented, modular solar power &amp; battery storage — deployable anywhere. Power on demand, on-grid or off.</p>

    <div class="pills">
      <span class="pill">⚡ Solar generation</span>
      <span class="pill">🔋 Battery storage</span>
      <span class="pill">🚀 Rapid deploy</span>
      <span class="pill">🌍 Off-grid</span>
    </div>

    <!-- Links + socials render here -->
    <nav class="links" id="links" aria-label="Winged Solar links"></nav>
    <div class="socials" id="socials" aria-label="Social media"></div>

    <footer>
      &copy; <span id="year"></span> Winged Solar Solutions Inc. &middot;
      <a href="https://wingedsolar.com/" target="_blank" rel="noopener">wingedsolar.com</a><br>
      Power anywhere. Water anywhere. Resilience everywhere.
    </footer>
  </main>

<script>
/* =========================================================================
   EDIT YOUR LINKS HERE
   -------------------------------------------------------------------------
   Each link: { title, sub, url, icon, accent }
     - icon:   one of the keys in ICONS below (globe, sparrow, hawk, eagle,
               water, quote, mail, doc)
     - accent: any CSS color (defaults to solar amber)
     - group:  optional heading shown above the link

   NOTE: The homepage URL below is confirmed. The product / contact paths
   are best-guess placeholders (the live site was not reachable from the
   build environment) — confirm or update them to the real page URLs.
   ========================================================================= */
const LINKS = [
  {
    group: "Start here",
    title: "Visit WingedSolar.com",
    sub: "wingedsolar.com — our official website",
    url: "https://wingedsolar.com/",
    icon: "globe",
    accent: "#ffd166"
  },
  {
    group: "Our platforms",
    title: "Sparrow",
    sub: "Compact, portable solar + storage",
    url: "https://wingedsolar.com/",
    icon: "sparrow",
    accent: "#ffd166"
  },
  {
    title: "Hawk",
    sub: "Rapidly deployable mobile power",
    url: "https://wingedsolar.com/",
    icon: "hawk",
    accent: "#ff9e3d"
  },
  {
    title: "Eagle",
    sub: "Permanent, large-scale energy systems",
    url: "https://wingedsolar.com/",
    icon: "eagle",
    accent: "#ff6b35"
  },
  {
    group: "Solutions",
    title: "Integrated Power + Water",
    sub: "Solar-powered atmospheric water generation",
    url: "https://wingedsolar.com/",
    icon: "water",
    accent: "#4f9dff"
  },
  {
    group: "Work with us",
    title: "Request a Quote",
    sub: "Tell us about your power needs",
    url: "https://wingedsolar.com/contact",
    icon: "quote",
    accent: "#ffd166"
  },
  {
    title: "Contact Us",
    sub: "Get in touch with the team",
    url: "https://wingedsolar.com/contact",
    icon: "mail",
    accent: "#ff9e3d"
  }
];

/* Social buttons — set url to "" to hide a button.
   Update the handles/URLs to your real profiles. */
const SOCIALS = [
  { name: "LinkedIn", icon: "linkedin", url: "https://www.linkedin.com/company/winged-solar-solutions" },
  { name: "Instagram", icon: "instagram", url: "" },
  { name: "X (Twitter)", icon: "x", url: "" },
  { name: "YouTube", icon: "youtube", url: "" },
  { name: "Email", icon: "mail", url: "mailto:info@wingedsolar.com" }
];

/* ---------------- Icons (inline SVG) ---------------- */
const ICONS = {
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg>',
  sparrow: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 13c4-1 7-1 10 1 0-4 2-7 6-8-1 2-1 3-3 4 2 0 3-1 5-3-1 4-3 7-7 8-3 1-8 1-11-2z"/></svg>',
  hawk: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 11c5-2 9-1 12 2 1-5 4-8 8-8-1 3-2 4-4 5 2 0 3 0 4-1-2 5-5 8-10 8-4 0-8-2-10-6z"/></svg>',
  eagle: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c1 3 3 5 6 6-2 0-3 0-4 1 3 1 5 0 7-2-1 4-4 6-8 6h-2c-4 0-7-2-8-6 2 2 4 3 7 2-1-1-2-1-4-1 3-1 5-3 6-6z"/></svg>',
  water: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  quote: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 1 1 5 8.5a2.5 2.5 0 0 1-.02-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.4 8.65 21 11 21 14.1V21h-4v-6.1c0-1.45-.03-3.3-2-3.3-2.02 0-2.33 1.57-2.33 3.2V21H9z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 3h3l-7 8 8.2 10h-6.4l-5-6.1L4.5 21H1.5l7.5-8.6L1 3h6.6l4.5 5.6zm-1.1 16h1.7L7.7 4.8H5.9z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.8-1.8C19.2 5 12 5 12 5s-7.2 0-8.8.5A2.5 2.5 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.8 1.8C4.8 19 12 19 12 19s7.2 0 8.8-.5a2.5 2.5 0 0 0 1.8-1.8C23 15.2 23 12 23 12zM9.8 15.3V8.7l5.7 3.3z"/></svg>'
};

/* ---------------- Render ---------------- */
(function () {
  const wrap = document.getElementById("links");
  let lastGroup = null;

  LINKS.forEach(function (l) {
    if (l.group && l.group !== lastGroup) {
      const h = document.createElement("div");
      h.className = "group-label";
      h.textContent = l.group;
      wrap.appendChild(h);
      lastGroup = l.group;
    }
    const a = document.createElement("a");
    a.className = "link";
    a.href = l.url;
    if (!/^mailto:/.test(l.url)) { a.target = "_blank"; a.rel = "noopener"; }
    if (l.accent) a.style.setProperty("--accent", l.accent);
    a.innerHTML =
      '<span class="ic">' + (ICONS[l.icon] || ICONS.globe) + '</span>' +
      '<span class="body">' +
        '<span class="title"></span>' +
        (l.sub ? '<span class="sub"></span>' : '') +
      '</span>' +
      '<span class="chev">' + ICONS.chev + '</span>';
    a.querySelector(".title").textContent = l.title;
    if (l.sub) a.querySelector(".sub").textContent = l.sub;
    wrap.appendChild(a);
  });

  const soc = document.getElementById("socials");
  SOCIALS.forEach(function (s) {
    if (!s.url) return;
    const a = document.createElement("a");
    a.className = "soc";
    a.href = s.url;
    a.setAttribute("aria-label", s.name);
    a.title = s.name;
    if (!/^mailto:/.test(s.url)) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = ICONS[s.icon] || ICONS.globe;
    soc.appendChild(a);
  });

  document.getElementById("year").textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
