<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Winged Solar Solutions — Links</title>
<meta name="description" content="Deployable solar power for work, home, and critical infrastructure. Factory-built solar, storage, and power + water platforms — Sparrow, Hawk, and Eagle." />
<meta name="theme-color" content="#123847" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Winged Solar Solutions" />
<meta property="og:description" content="Deployable solar power for work, home, and critical infrastructure." />
<meta property="og:url" content="https://wingedsolar.com/" />

<style>
  /* =========================================================
     Winged Solar Solutions — Linktree (pill-list style)
     Single-file, self-contained. Edit the BUTTONS array near
     the bottom of this file to change links.
     ========================================================= */

  :root {
    --blue-deep:  #0e2f3d;
    --blue:       #17506a;
    --teal:       #2f8fb0;
    --teal-light: #57b3d6;
    --gold:       #f6a623;
    --gold-deep:  #e07d10;

    --ink:        #ffffff;
    --ink-soft:   rgba(255,255,255,0.72);

    --pill:       rgba(255,255,255,0.09);
    --pill-hi:    rgba(255,255,255,0.17);
    --border:     rgba(255,255,255,0.42);
    --border-hi:  rgba(246,166,35,0.95);

    --maxw:       600px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 54px 22px 40px;
    position: relative;
    /* Brand background: steel-blue glow over deep navy */
    background:
      radial-gradient(90% 70% at 50% 8%, rgba(87,179,214,0.30), transparent 60%),
      radial-gradient(120% 90% at 50% 120%, rgba(246,166,35,0.14), transparent 55%),
      linear-gradient(160deg, var(--blue) 0%, #123847 52%, var(--blue-deep) 100%);
    background-attachment: fixed;
  }

  .wrap {
    width: 100%;
    max-width: var(--maxw);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------------- Header ---------------- */
  .logo-plate {
    width: min(340px, 82%);
    padding: 22px 26px;
    display: grid; place-items: center;
    border-radius: 22px;
    background: #ffffff;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.35),
      0 22px 50px rgba(4,20,28,0.42),
      0 4px 14px rgba(0,0,0,0.22);
    margin-bottom: 18px;
  }
  .logo-img { width: 100%; height: auto; display: block; }

  /* Fallback emblem (shown only if the logo image fails to load) */
  .logo-fallback { flex-direction: column; align-items: center; gap: 8px; }
  .logo-fallback svg { width: 92px; height: 92px; display: block; }
  .logo-fallback .fb-word {
    font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; color: var(--blue-deep);
  }
  .logo-fallback .fb-word .sol { color: var(--gold-deep); }
  .tagline {
    margin-top: 9px; color: var(--ink-soft);
    font-size: 0.95rem; text-align: center; line-height: 1.5; max-width: 430px;
  }

  /* ---------------- Buttons ---------------- */
  .links {
    width: 100%; margin-top: 30px;
    display: flex; flex-direction: column; gap: 15px;
  }

  .link {
    position: relative;
    display: flex; align-items: center;
    width: 100%; min-height: 62px;
    padding: 12px 22px;
    border-radius: 999px;
    background: var(--pill);
    border: 1.5px solid var(--border);
    color: var(--ink);
    text-decoration: none;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: transform 0.18s ease, background 0.18s ease,
                border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .link:hover, .link:focus-visible {
    transform: translateY(-2px);
    background: var(--pill-hi);
    border-color: var(--border-hi);
    box-shadow: 0 12px 28px rgba(4,20,28,0.4);
    outline: none;
  }
  .link:active { transform: translateY(0); }

  .link .ic {
    position: absolute; left: 16px;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    color: #fff;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .link:hover .ic { background: rgba(246,166,35,0.22); color: var(--gold); }
  .link .ic svg { width: 20px; height: 20px; display: block; }

  .link .label {
    flex: 1; text-align: center;
    font-size: 1.02rem; font-weight: 650; letter-spacing: -0.01em;
    padding: 0 34px;
  }

  /* Highlighted CTA (gold) */
  .link.cta {
    background: linear-gradient(180deg, var(--gold), var(--gold-deep));
    border-color: transparent;
    color: #26160a;
    box-shadow: 0 12px 26px rgba(224,125,16,0.42);
  }
  .link.cta .ic { background: rgba(38,22,10,0.16); color: #26160a; }
  .link.cta:hover { background: linear-gradient(180deg, #ffb735, var(--gold-deep)); }
  .link.cta:hover .ic { background: rgba(38,22,10,0.22); color: #26160a; }

  /* ---------------- Footer ---------------- */
  footer {
    margin-top: 34px; text-align: center;
    color: var(--ink-soft); font-size: 0.8rem; line-height: 1.7;
  }
  footer a { color: #fff; text-decoration: none; font-weight: 600; }
  footer a:hover { color: var(--gold); }

  @media (max-width: 430px) {
    h1 { font-size: 1.32rem; }
    .logo { width: 116px; height: 116px; }
    .logo svg { width: 84px; height: 84px; }
    .link .label { font-size: 0.96rem; padding: 0 30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wrap { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="logo-plate">
      <!-- Official logo. Drop the exact file in this folder as winged-solar-logo.png -->
      <img class="logo-img" src="winged-solar-logo.png" alt="Winged Solar Solutions"
           onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex';" />

      <!-- Fallback emblem (only shows if the logo image is missing) -->
      <div class="logo-fallback" id="logoFallback" style="display:none" aria-hidden="true">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="wing" x1="18" y1="30" x2="104" y2="86" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#63b7e2"/>
              <stop offset="0.55" stop-color="#2f8fb0"/>
              <stop offset="1" stop-color="#1b4e63"/>
            </linearGradient>
            <linearGradient id="sun" x1="60" y1="20" x2="80" y2="52" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffd15c"/>
              <stop offset="1" stop-color="#ef8f1c"/>
            </linearGradient>
          </defs>
          <g stroke="url(#sun)" stroke-width="3.4" stroke-linecap="round">
            <line x1="72" y1="16" x2="72" y2="24"/>
            <line x1="90" y1="22" x2="85" y2="29"/>
            <line x1="99" y1="38" x2="91" y2="41"/>
            <line x1="54" y1="22" x2="59" y2="29"/>
          </g>
          <circle cx="72" cy="42" r="15" fill="url(#sun)"/>
          <path d="M60 60 C44 46 28 40 10 42 C24 48 33 55 40 63 C28 60 18 61 10 66
                   C26 68 40 70 52 66 C46 72 42 78 40 86 C50 78 57 70 60 60 Z" fill="url(#wing)"/>
          <path d="M60 60 C76 46 92 40 110 42 C96 48 87 55 80 63 C92 60 102 61 110 66
                   C94 68 80 70 68 66 C74 72 78 78 80 86 C70 78 63 70 60 60 Z" fill="url(#wing)"/>
          <path d="M60 58 C58 66 57 76 60 92 C63 76 62 66 60 58 Z" fill="url(#wing)"/>
          <path d="M60 52 C56 52 54 55 55 59 C57 61 63 61 65 59 C66 55 64 52 60 52 Z" fill="#1b4e63"/>
        </svg>
        <span class="fb-word">Winged Solar <span class="sol">Solutions</span></span>
      </div>
    </div>

    <p class="tagline">Deployable solar power for work, home, and critical infrastructure.</p>

    <nav class="links" id="links" aria-label="Winged Solar links"></nav>

    <footer>
      Copyright &copy; <span id="year"></span> Winged Solar Solutions<br>
      <a href="https://wingedsolar.com/" target="_blank" rel="noopener">wingedsolar.com</a>
    </footer>
  </main>

<script>
/* =========================================================================
   EDIT YOUR LINKS HERE
   -------------------------------------------------------------------------
   Each button: { label, url, icon, cta? }
     icon: globe, grid, solutions, water, quote, faq, about,
           linkedin, instagram, x, facebook, youtube, mail
     cta:  true  -> highlighted gold button
   NOTE: The homepage is confirmed. Section paths mirror the site nav and the
   social handles are best-guess placeholders — confirm/replace them with the
   real page and profile URLs.
   ========================================================================= */
const BUTTONS = [
  { label: "Winged Solar Website",     url: "https://wingedsolar.com/",             icon: "globe" },
  { label: "Request a Consultation",   url: "https://wingedsolar.com/",             icon: "quote", cta: true },
  { label: "About Us",                 url: "https://wingedsolar.com/about",        icon: "about" },
  { label: "LinkedIn",                 url: "https://www.linkedin.com/company/winged-solar-solutions", icon: "linkedin" },
  { label: "Instagram",                url: "https://www.instagram.com/wingedsolar/", icon: "instagram" },
  { label: "X (Twitter)",              url: "https://x.com/wingedsolar",            icon: "x" },
  { label: "Facebook",                 url: "https://www.facebook.com/wingedsolar", icon: "facebook" }
];

const st = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  globe:    '<svg viewBox="0 0 24 24" '+st+'><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg>',
  grid:     '<svg viewBox="0 0 24 24" '+st+'><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  solutions:'<svg viewBox="0 0 24 24" '+st+'><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 3v18M4 7.5l8 4.5 8-4.5"/></svg>',
  water:    '<svg viewBox="0 0 24 24" '+st+'><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  quote:    '<svg viewBox="0 0 24 24" '+st+'><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></svg>',
  faq:      '<svg viewBox="0 0 24 24" '+st+'><circle cx="12" cy="12" r="9"/><path d="M9.2 9.2a2.8 2.8 0 0 1 5.4 1c0 1.8-2.6 2.3-2.6 3.8"/><path d="M12 17.2h0"/></svg>',
  about:    '<svg viewBox="0 0 24 24" '+st+'><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.4 3.1-5.5 7-5.5s7 2.1 7 5.5"/></svg>',
  mail:     '<svg viewBox="0 0 24 24" '+st+'><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 1 1 5 8.5a2.5 2.5 0 0 1-.02-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.4 8.65 21 11 21 14.1V21h-4v-6.1c0-1.45-.03-3.3-2-3.3-2.02 0-2.33 1.57-2.33 3.2V21H9z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>',
  x:        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 3h3l-7 8 8.2 10h-6.4l-5-6.1L4.5 21H1.5l7.5-8.6L1 3h6.6l4.5 5.6zm-1.1 16h1.7L7.7 4.8H5.9z"/></svg>',
  facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>',
  youtube:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.8-1.8C19.2 5 12 5 12 5s-7.2 0-8.8.5A2.5 2.5 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.8 1.8C4.8 19 12 19 12 19s7.2 0 8.8-.5a2.5 2.5 0 0 0 1.8-1.8C23 15.2 23 12 23 12zM9.8 15.3V8.7l5.7 3.3z"/></svg>'
};

(function () {
  const wrap = document.getElementById("links");
  BUTTONS.forEach(function (b) {
    const a = document.createElement("a");
    a.className = "link" + (b.cta ? " cta" : "");
    a.href = b.url;
    if (!/^mailto:/.test(b.url)) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML =
      '<span class="ic">' + (ICONS[b.icon] || ICONS.globe) + '</span>' +
      '<span class="label"></span>';
    a.querySelector(".label").textContent = b.label;
    wrap.appendChild(a);
  });
  document.getElementById("year").textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
